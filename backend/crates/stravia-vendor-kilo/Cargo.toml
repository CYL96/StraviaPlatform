[package]
name = "stravia-vendor-kilo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Dedicated Kilo Gateway Wasm vendor"
publish = false
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "contract"
path = "tests/contract.rs"

[lints]
workspace = true

[dependencies]
stravia-vendor-sdk.workspace = true
stravia-vendor-common.workspace = true
stravia-protocol-codec.workspace = true
stravia-runtime-contract.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
semver.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }

[build-dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
stravia-vendor-runtime.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
